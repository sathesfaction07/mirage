name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Rich wraps to the terminal width and a CI runner reports 80. The greps below assert on
      # whole sentences, so give it room rather than matching fragments.
      COLUMNS: "200"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests data

      - name: The corpus is reproducible, and the generator owns its directory
        run: |
          # A leftover export from an older field convention parses cleanly and silently
          # changes every count in the report.
          printf 'ticket_id\n' > data/stale_leftover.csv
          python data/generate.py
          test ! -f data/stale_leftover.csv
          test "$(ls data/*.csv data/*.json | wc -l)" -eq 3

      - name: Test
        run: pytest -q --cov=escalation_insight --cov-report=term-missing

      - name: A ratio is scale-free and its evidence is not
        run: |
          python - <<'PY'
          from escalation_insight.evidence import claim, power_floor, scale_demo, two_sided_p
          from escalation_insight.models import Direction

          # Sanity, against values computable by hand.
          assert abs(two_sided_p(10, 10, 0.5) - 2 / 1024) < 1e-12
          assert two_sided_p(5, 10, 0.5) == 1.0
          assert two_sided_p(0, 0, 0.5) == 1.0, "nothing observed refutes nothing"

          # THE FINDING: identical ratio, opposite verdicts.
          demo = scale_demo()
          assert demo.small.count_ratio == demo.large.count_ratio == 3.0
          assert demo.small.direction is Direction.UNKNOWN
          assert demo.large.direction is Direction.UP
          assert demo.small.p_value > 0.5, "1 -> 3 happens more often than not"
          assert demo.large.p_value < 1e-8
          assert demo.verdicts_differ
          assert "compatible with having found nothing at all" in demo.summary()

          # And the corpus's own 3x is not evidence of anything.
          pack = claim("packaging", count_before=1, count_after=3, days_before=31,
                       days_after=28, alpha=0.05)
          assert pack.direction is Direction.UNKNOWN
          assert "NOT evidence of a change" in pack.headline()

          # A study that could not have found anything, whatever happened.
          assert power_floor(total=4, days_before=31, days_after=28).detectable == ()
          assert "says nothing about the world" in power_floor(
              total=4, days_before=31, days_after=28
          ).summary()
          print(f"  3x: p={demo.small.p_value:.2f} vs p={demo.large.p_value:.1e}")
          PY

      - name: The calendar manufactures a trend, and favours good news
        run: |
          python - <<'PY'
          from escalation_insight.evidence import claim, smallest_flip

          # Ignoring month length can decide the verdict outright.
          flip = smallest_flip()
          assert flip is not None and flip.verdict_flips
          assert flip.count_after > 0 and flip.n - flip.count_after > 0, "a real ratio"
          assert flip.naive.direction.value == "UNKNOWN"
          assert flip.adjusted.direction.value == "UP"
          assert "The shorter month was doing the work" in flip.summary()

          # The bias is ASYMMETRIC: a shorter later month makes an increase MORE surprising
          # and a decrease LESS, so an unadjusted report is tilted toward good news.
          rise_naive = claim("n", count_before=40, count_after=60, days_before=30,
                             days_after=30, alpha=0.05).p_value
          rise_adj = claim("a", count_before=40, count_after=60, days_before=31,
                           days_after=28, alpha=0.05).p_value
          assert rise_adj < rise_naive, "an increase is more surprising once Feb is short"
          fall_naive = claim("n", count_before=60, count_after=40, days_before=30,
                            days_after=30, alpha=0.05).p_value
          fall_adj = claim("a", count_before=60, count_after=40, days_before=31,
                           days_after=28, alpha=0.05).p_value
          assert fall_adj > fall_naive, "a decrease is less surprising once Feb is short"

          # Even the headline number moves.
          pack = claim("p", count_before=1, count_after=3, days_before=31, days_after=28,
                       alpha=0.05)
          assert pack.count_ratio == 3.0 and pack.rate_ratio > 3.3
          print(f"  flip at {flip.n - flip.count_after} -> {flip.count_after}")
          PY

      - name: There is no FLAT, and it is unreachable by algebra
        run: |
          python - <<'PY'
          from escalation_insight.evidence import claim, two_sided_p
          from escalation_insight.models import Direction

          assert [d.value for d in Direction] == ["UP", "DOWN", "UNKNOWN"]
          assert not hasattr(Direction, "FLAT")

          # The modal outcome is never surprising, whatever the exposures -- so a verdict of
          # "the rate did not change" cannot be reached at any alpha below 1.
          for total, before_days, after_days in (
              (300, 30, 30), (22, 31, 28), (100, 31, 30), (59, 31, 28), (7, 31, 28),
          ):
              share = after_days / (before_days + after_days)
              modal = round(total * share)
              assert abs(two_sided_p(modal, total, share) - 1.0) < 1e-9

          exact = claim("c", count_before=300, count_after=300, days_before=30, days_after=30,
                        alpha=0.99)
          assert exact.rate_ratio == 1.0 and exact.p_value == 1.0
          assert exact.direction is Direction.UNKNOWN, "not FLAT -- there is no such answer"
          assert "failing to be surprised is" in Direction.__doc__
          print("  a null test can fail to be surprised; it cannot prove nothing moved")
          PY

      - name: Merging labels reverses the trend, and revising rewrites the past
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path

          from escalation_insight.aggregate import load_tickets, payload, run
          from escalation_insight.buckets import build_series
          from escalation_insight.config import Settings
          from escalation_insight.mapping import MappingSet
          from escalation_insight.models import Grain, Unit

          tickets = load_tickets(Path("data/tickets.csv"))
          mappings = MappingSet.load(Path("data/mappings.json"))

          # THE FINDING: same tickets, opposite sign.
          counts = {}
          for version in ("v1", "v2"):
              series = build_series(
                  tickets, category="delivery_timing", mapping=mappings.get(version),
                  unit=Unit.TICKET, grain=Grain.MONTH, as_of=dt.date(2026, 3, 12),
              )
              counts[version] = {b.label: b.count for b in series.buckets}
          assert counts["v1"]["2026-01"] == counts["v2"]["2026-01"] == 10
          assert counts["v1"]["2026-02"] == 6, "unmerged: falls"
          assert counts["v2"]["2026-02"] == 12, "merged: rises"

          analysis = run(Settings(data_dir=Path("data")))
          result = payload(analysis)

          # A revision edits a CLOSED month.
          first = analysis.version_effects[0]
          assert first.rewritten["delivery_timing"]["2026-02"] == (6, 12)
          assert (first.unmapped_before, first.unmapped_after) == (7, 1)
          assert "retroactive edit" in first.summary()
          assert result["history_rewrites"] == [{"from": "v1", "to": "v2", "buckets": 1}]

          # And a SPLIT deletes a category rather than moving it.
          second = analysis.version_effects[1]
          assert "delivery_timing" in second.disappeared
          assert set(second.appeared) == {"carrier_delay", "promise_missed"}
          assert result["deleted_by_a_revision"] == ["delivery_timing"]
          assert result["readings_per_category"]["delivery_timing"] == 16, (
              "8 readings cannot be run at all, and are reported rather than skipped"
          )
          print(f"  v1 Feb={counts['v1']['2026-02']}, v2 Feb={counts['v2']['2026-02']}")
          PY

      - name: The unit changes the direction and deduplication is not even
        run: |
          python - <<'PY'
          from pathlib import Path

          from escalation_insight.aggregate import payload, run
          from escalation_insight.config import Settings
          from escalation_insight.units import depths, lineage_disagreement

          analysis = run(Settings(data_dir=Path("data")))
          effect = next(u for u in analysis.unit_effects if u.category == "returns")

          # Opposite directions from the same escalations.
          assert dict(effect.by_ticket)["2026-01"] == 6
          assert dict(effect.by_ticket)["2026-02"] == 9, "up by ticket"
          assert dict(effect.by_case)["2026-02"] == 4, "down by case"

          # THE SHARPER RESULT: dedup takes its rows from ONE month -- the worst one.
          assert dict(effect.removed) == {"2026-01": 0, "2026-02": 5, "2026-03": 0}
          assert effect.evenly_spread is False
          assert effect.worst_hit == ("2026-02", 5)
          assert "subtracts most from the period that went worst" in effect.summary()
          assert payload(analysis)["uneven_dedup"] == ["returns"]

          # The case that would not close collapses to the same 1 as a case answered once.
          deepest = depths(analysis.tickets)[0]
          assert (deepest.case_id, deepest.tickets, deepest.reopens) == ("C-600", 6, 5)
          assert "indistinguishable from a case that was answered once" in deepest.note()

          # And the unit everybody MEANS is not derivable at all.
          from escalation_insight.units import why_neither_unit_is_right
          assert "DISTINCT UNDERLYING PROBLEM" in why_neither_unit_is_right()
          assert lineage_disagreement(analysis.tickets) == ("T-912",)
          print("  tickets 6->9 up, cases 6->4 down, dedup removed 5 from Feb alone")
          PY

      - name: The newest bucket is incomplete, and the direction is a choice
        run: |
          python - <<'PY'
          import datetime as dt
          from pathlib import Path

          from escalation_insight.aggregate import payload, run
          from escalation_insight.config import Settings
          from escalation_insight.models import Direction

          analysis = run(Settings(data_dir=Path("data")))
          result = payload(analysis)

          # Partial period AND recording lag, both biting the same bucket.
          first = next(c for c in analysis.censored if c.category == "delivery_timing")
          assert (first.elapsed_days, first.nominal_days) == (12, 31)
          assert first.visible == 2 and first.late_arrivals == 1
          assert abs(first.understated_by - 1 / 3) < 1e-9
          assert "There is no third option" in first.summary()
          assert len(result["censored"]) == 2
          assert {c["category"] for c in result["censored"]} == {"delivery_timing", "returns"}

          # Nothing survives every reading; the failures are of THREE distinct kinds.
          assert result["survives_every_reading"] == []
          assert result["settings_decide_direction"] == ["delivery_timing", "returns"]
          assert sorted(result["never_established"]) == ["misc", "packaging"]
          for category in result["settings_decide_direction"]:
              found = next(s for s in analysis.sensitivities if s.category == category)
              assert set(found.directions) == {Direction.DOWN, Direction.UNKNOWN}
              assert "decided by configuration, not by what happened" in found.summary()

          # UNKNOWN (tested, unconvincing) is NOT the same as untestable.
          misc = next(s for s in analysis.sensitivities if s.category == "misc")
          assert len(misc.comparable_choices) == 12 and len(misc.choices) == 24
          assert "decides whether the question can even be ASKED" in misc.summary()

          # Once the month is over, nothing is censored.
          later = run(Settings(data_dir=Path("data"), as_of=dt.date(2026, 5, 1)))
          assert later.censored == ()
          print("  0 of 4 categories survive every reading")
          PY

      - name: An SOP gap is not observable, and the ranking flips
        run: |
          python - <<'PY'
          from pathlib import Path

          from escalation_insight.aggregate import payload, run
          from escalation_insight.config import Settings
          from escalation_insight.gaps import why_a_gap_is_not_observable
          from escalation_insight.models import GapCause

          analysis = run(Settings(data_dir=Path("data")))
          result = payload(analysis)

          # The MOST-asked topic is the one the SOP documents, so the one cause a new
          # section would fix is exactly the one already ruled out.
          top = next(g for g in analysis.topic_gaps if g.category == "returns")
          assert top.questions == 41 and top.documented and top.section == "4.2"
          assert GapCause.NOT_DOCUMENTED not in top.candidates
          assert len(top.candidates) == 3
          assert top.adding_a_section_would_help is False
          assert result["ranking_by_volume"][0] == "returns"

          # Being undocumented rules out NOTHING.
          pack = next(g for g in analysis.topic_gaps if g.category == "packaging")
          assert pack.documented is False and len(pack.candidates) == 4
          assert pack.adding_a_section_would_help is None
          assert "rules nothing out" in pack.note()

          # And dividing by volume changes which topic looks worst.
          assert result["ranking_agrees"] is False
          assert result["ranking_by_volume"] == ["returns", "delivery_timing", "packaging"]
          assert result["ranking_by_rate"] == ["returns", "packaging", "delivery_timing"]
          assert "decided by whether somebody divided" in analysis.ranking.summary()
          assert "harder document to find anything in" in why_a_gap_is_not_observable()
          print("  the top-asked topic is documented at section 4.2")
          PY

      - name: check gates on what the producer can fix, not on the world
        run: |
          ! escalation-insight check
          escalation-insight check | grep -q 'Fixable at the source'
          escalation-insight check | grep -q 'FAIL on 5 producer-fixable defect(s)'
          escalation-insight check | grep -q 'populate the event timestamp'
          escalation-insight check | grep -q 'emit each id once'
          escalation-insight check | grep -q 'Reported and NOT failed on'
          escalation-insight check | grep -q 'Nobody can fix time'
          escalation-insight check | grep -q 'configuring it is a judgement, not a defect'
          escalation-insight check | grep -q 'Choosing a unit is not a defect'
          escalation-insight check | grep -q 'teach people to stop running the check'

          # A clean export PASSES -- and still reports what it cannot establish.
          mkdir -p /tmp/clean
          cat > /tmp/clean/tickets.csv <<'CSV'
          ticket_id,case_id,raw_category,opened_at,recorded_at,team,reopen_of
          T-1,C-1,shipping delay,2026-01-05,2026-01-06,logistics,
          T-2,C-2,shipping delay,2026-02-05,2026-02-06,logistics,
          CSV
          printf '{"as_of": "2026-04-01", "versions": {"v2": {"description": "d", "categories": {"shipping delay": "delivery_timing"}}}}' > /tmp/clean/mappings.json
          printf '{"document": "d", "revision": 1, "covers": {"delivery_timing": "1.1"}, "questions": {"delivery_timing": 4}}' > /tmp/clean/sop.json
          escalation-insight check --data-dir /tmp/clean
          escalation-insight check --data-dir /tmp/clean | grep -q 'Nothing fixable at source'
          escalation-insight check --data-dir /tmp/clean | grep -q 'cannot be read from this export'

          # ...and one wrong label alone is enough to FAIL.
          mkdir -p /tmp/badlabel
          cp /tmp/clean/mappings.json /tmp/clean/sop.json /tmp/badlabel/
          cat > /tmp/badlabel/tickets.csv <<'CSV'
          ticket_id,case_id,raw_category,opened_at,recorded_at,team,reopen_of
          T-1,C-1,shipping delay,2026-01-05,2026-01-06,logistics,
          T-2,C-2,widget went bang,2026-02-05,2026-02-06,logistics,
          CSV
          ! escalation-insight check --data-dir /tmp/badlabel
          escalation-insight check --data-dir /tmp/badlabel | grep -q 'UNMAPPED_CATEGORY'
          echo "a short February does not gate; a broken row does"

      - name: Every command publishes its reasoning
        run: |
          escalation-insight report | grep -q 'It is events x how many got reported'
          escalation-insight report | grep -q 'newest bucket is EXCLUDED from every direction'
          escalation-insight report | grep -q 'NOT evidence of a change'
          escalation-insight trend | grep -q 'Nothing in the escalations chooses between them'
          escalation-insight trend | grep -q 'revision that splits a category deletes it'
          escalation-insight trend | grep -q 'not the same as the rate being flat'
          escalation-insight evidence | grep -q 'Both of these are a 3x increase'
          escalation-insight evidence | grep -q 'The verdict FLIPS'
          escalation-insight evidence | grep -q 'finding none says nothing about the world'
          escalation-insight mapping | grep -q 'A revised mapping is a retroactive edit'
          escalation-insight mapping | grep -q 'categories that stop existing'
          escalation-insight mapping | grep -q 'It is inside it'
          escalation-insight unit | grep -q 'subtracts most from the period that went worst'
          escalation-insight unit | grep -q 'DISTINCT UNDERLYING PROBLEM'
          escalation-insight censoring | grep -q 'There is no third option'
          escalation-insight censoring | grep -q 'not because anything improved'
          escalation-insight gaps | grep -q 'adding a section makes this WORSE'
          escalation-insight gaps | grep -q 'invisible by volume and prominent by rate'
          escalation-insight doctor | grep -q 'Chosen, not measured'
          escalation-insight doctor | grep -q 'Never measured, by anything here'
          escalation-insight doctor | grep -q 'only how many were recorded'
          escalation-insight doctor | grep -q 'alpha 0.05 is a convention'
          escalation-insight explain returns | grep -q 'unit=TICKET grain=MONTH mapping=v2'
          escalation-insight explain misc | grep -q 'fewer than two comparable buckets'
          escalation-insight explain nonsense | grep -q "no category 'nonsense'"
          echo "all commands explain themselves"

  test-windows:
    # The Linux job runs the full suite plus this project's own checks. This job runs the
    # test suite on Windows, where the default encoding is cp1252 and paths use backslashes:
    # several projects in this portfolio shipped bugs that only failed there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
